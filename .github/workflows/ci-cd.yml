name: CI/CD

on:
  push:
    branches:
      - development
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: Validate deployment configuration
        run: tests/deployment.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gateway-web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: apps/gateway-web/package.json

      - name: Install web dependencies
        working-directory: apps/gateway-web
        run: pnpm install --frozen-lockfile

      - name: Web tests
        working-directory: apps/gateway-web
        run: pnpm test

      - name: Web lint
        working-directory: apps/gateway-web
        run: pnpm lint

      - name: Web build
        working-directory: apps/gateway-web
        run: pnpm build

      - name: Web typecheck
        working-directory: apps/gateway-web
        run: pnpm typecheck

  publish:
    name: Publish container images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (gateway)
        id: gateway-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omnimusha-suite/tuenel-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.gateway-meta.outputs.tags }}
          labels: ${{ steps.gateway-meta.outputs.labels }}

      - name: Docker metadata (gateway-web)
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/omnimusha-suite/tuenel-gateway-web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push gateway-web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/gateway-web
          file: ./apps/gateway-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
