name: CI

on:
  workflow_call:
    inputs:
      build_web:
        required: false
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-rust-${{ runner.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: Validate deployment configuration
        run: tests/deployment.sh

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/gateway-web/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gateway-web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/gateway-web
        run: pnpm install --frozen-lockfile

      - name: Web checks
        working-directory: apps/gateway-web
        run: |
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm build
        if: ${{ github.event_name != 'workflow_call' || inputs.build_web }}
