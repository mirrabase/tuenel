name: Container release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
    with:
      build_web: false

  publish:
    name: Publish ${{ matrix.name }}
    needs: validate
    if: always() && (github.ref == 'refs/heads/main' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            image: ghcr.io/mirrabase/tuenel-gateway
            context: .
            dockerfile: ./Dockerfile
          - name: gateway-web
            image: ghcr.io/mirrabase/tuenel-gateway-web
            context: ./apps/gateway-web
            dockerfile: ./apps/gateway-web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=tuenel-public-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=tuenel-public-${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Write image manifest entry
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          jq -n \
            --arg name "$NAME" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{name: $name, image: $image, digest: $digest, commit: $commit}' \
            > "image-${NAME}.json"

      - name: Upload image manifest entry
        uses: actions/upload-artifact@v7
        with:
          name: public-image-${{ matrix.name }}
          path: image-${{ matrix.name }}.json
          if-no-files-found: error

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image without a long-lived key
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  manifest:
    name: Publish public image manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v7

      - name: Download image manifest entries
        uses: actions/download-artifact@v8
        with:
          pattern: public-image-*
          path: entries
          merge-multiple: true

      - name: Build combined manifest
        run: |
          jq -n \
            --arg schema "tuenel.public-images/v1" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --slurpfile images <(jq -s '.' entries/image-*.json) \
            '{schema: $schema, ref: $ref, commit: $commit, images: $images[0]}' \
            > image-manifest.json
          cat image-manifest.json

      - name: Upload combined manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-image-manifest
          path: image-manifest.json
          if-no-files-found: error

      - name: Publish manifest to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" image-manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" image-manifest.json \
              --title "Tuenel $GITHUB_REF_NAME" --generate-notes
          fi
