name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact --verbose /github/workspace

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
