services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gateway-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: ghcr.io/mirrabase/tuenel-gateway:${TUENEL_VERSION:-latest}
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      GATEWAY_CREDENTIALS_MASTER_KEY: ${GATEWAY_CREDENTIALS_MASTER_KEY:?Set GATEWAY_CREDENTIALS_MASTER_KEY in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-gateway_admin}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-}
      GATEWAY_MODEL_ALIAS: ${GATEWAY_MODEL_ALIAS:-gateway-default}
      GATEWAY_BIND_ADDR: 0.0.0.0:8080
      DEFAULT_VIRTUAL_KEY_DAILY_TOKENS: ${DEFAULT_VIRTUAL_KEY_DAILY_TOKENS:-100000}
      RUST_LOG: ${RUST_LOG:-info}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOW_PRIVATE_HTTP_ENDPOINTS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway-web:
    image: ghcr.io/mirrabase/tuenel-gateway-web:${TUENEL_VERSION:-latest}
    build:
      context: ./apps/gateway-web
      dockerfile: Dockerfile
    environment:
      GATEWAY_API_URL: http://gateway:8080
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in .env}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${GATEWAY_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/en/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gateway-postgres:
